services:
  dashboard:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://192.168.50.148:8001}
    container_name: openbrain-dashboard
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://192.168.50.148:8001}
      SESSION_SECRET: ${SESSION_SECRET}
      AGENT_MEMORY_API_URL: ${AGENT_MEMORY_API_URL:-}
      AGENT_MEMORY_WORKSPACE_ID: ${AGENT_MEMORY_WORKSPACE_ID:-}
      AGENT_MEMORY_PROJECT_ID: ${AGENT_MEMORY_PROJECT_ID:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "${DASHBOARD_PORT:-3003}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
